[project]
name = "rl-env"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "argcomplete>=3.0.0",
    "docker>=7.1.0",
    "dotenv>=0.9.9",
    "google-cloud-storage>=2.18",
    "json5>=0.9.25",
    "google-auth>=2.41.1",
    "google-auth-oauthlib>=1.2.3",
    "humanfriendly>=10.0",
    "mypy>=1.18.2",
    "psutil>=7.1.3",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "tabulate>=0.9.0",
    "tqdm>=4.67.0",
    "types-pyyaml",
    "types-docker>=7.1.0.20251009",
    "types-humanfriendly>=10.0.1.20250319",
    "types-psutil>=7.1.1.20251122",
    "types-tabulate>=0.9.0.20241207",
    "types-tqdm>=4.67.3.20260205",
    "torch>=2.11.0",
    "datasets>=4.8.4",
    "transformers>=5.4.0",
    "anthropic>=0.86.0",
    "boto3>=1.42.92",
    "asyncpg>=0.31.0",
    "pytest>=9.0",
    "hypothesis>=6.0",
    "pathspec>=1.1.1",
    "libtmux>=0.62.0",
    "pydantic>=2",
    "zstandard>=0.23",
]

[tool.setuptools]
packages = []

# GRADER/grader is mounted into the container at /grader, so it never resolves here.
[[tool.ty.overrides]]
include = ["docker/grader/run_grader.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"

[tool.mypy]
python_version = "3.12"

# google_auth_oauthlib ships no type stubs, so it does not resolve here.
[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true

# The shim's tools hang off @mcp.tool(), which is untyped because mcp resolves
# to Any here (container-only). Nothing to gain from flagging it under --strict.
[[tool.mypy.overrides]]
module = ["shim.*"]
disallow_untyped_decorators = false
